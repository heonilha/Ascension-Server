[package]
name = "asc-server"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ascension-server"
path = "src/main.rs"

[dependencies]
asc-protocol.workspace = true
asc-movement.workspace = true
asc-game = { path = "../game" }
bytemuck.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
